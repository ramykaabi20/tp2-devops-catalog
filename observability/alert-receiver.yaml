# Récepteur de webhooks qui journalise les notifications d'Alertmanager.
# Il remplace PagerDuty (route /pager) et Slack (route /slack) pour la démo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-receiver
  namespace: observability
data:
  server.py: |
    import json
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))) or b"{}")
            channel = "PAGE (astreinte)" if self.path == "/pager" else "SLACK #sre-alerts"
            alerts = body.get("alerts", [])
            for att in body.get("attachments", []):  # format Slack
                print(f"{datetime.now(timezone.utc):%H:%M:%S} [{channel}] {att.get('title')} - "
                      f"{att.get('text', '').strip()}", flush=True)
            for a in alerts:
                print(f"{datetime.now(timezone.utc):%H:%M:%S} [{channel}] {a['status'].upper()} "
                      f"{a['labels'].get('alertname')} severity={a['labels'].get('severity')} "
                      f"- {a['annotations'].get('summary', '')}", flush=True)
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok")

        def log_message(self, *args):
            pass

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: alert-receiver }
  template:
    metadata:
      labels: { app: alert-receiver }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: receiver
          image: python:3.12.8-alpine
          command: ["python", "-u", "/app/server.py"]
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts: [{ name: code, mountPath: /app }]
      volumes:
        - name: code
          configMap: { name: alert-receiver }
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: observability
spec:
  selector: { app: alert-receiver }
  ports: [{ port: 8080, targetPort: 8080 }]
