name: CI/CD catalog-api

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Moindre privilège : aucune permission par défaut, chaque job déclare les siennes.
permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/catalog-api

# Toutes les actions sont épinglées par SHA de commit complet (supply chain),
# la version lisible est indiquée en commentaire.
jobs:
  lint-test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Dépendances verrouillées (hashes, wheels uniquement)
        run: pip install --require-hashes --only-binary ":all:" -r requirements-dev.lock
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests unitaires + couverture (Cobertura, seuil 85 %)
        run: pytest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.xml

  sonar:
    name: SonarCloud Analysis & Quality Gate
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # décoration des PR par SonarCloud
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
      - name: Vérifier la configuration SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          ORG: ${{ vars.SONAR_ORGANIZATION }}
          KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          ok=true
          [ -n "$SONAR_TOKEN" ] || { echo "::error::Secret SONAR_TOKEN absent (Settings > Secrets > Actions)"; ok=false; }
          [ -n "$ORG" ] || { echo "::error::Variable SONAR_ORGANIZATION absente (onglet Variables)"; ok=false; }
          [ -n "$KEY" ] || { echo "::error::Variable SONAR_PROJECT_KEY absente (onglet Variables)"; ok=false; }
          echo "::notice::SonarCloud organization='$ORG' projectKey='$KEY' token=$([ -n "$SONAR_TOKEN" ] && echo present || echo absent)"
          $ok
      - name: SonarCloud scan
        id: scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.exclusions=scripts/**
            -Dsonar.python.coverage.reportPaths=coverage.xml
      - name: Diagnostic du scan
        if: failure() && steps.scan.outcome == 'failure'
        run: |
          echo "::error::Le scanner SonarCloud a échoué : vérifier que l'organisation et la clé du projet existent, que le token est valide et que l'Automatic Analysis est désactivée."
      - name: Quality Gate (bloquant)
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  build-scan-push:
    name: Build, Trivy Scan & Push
    needs: sonar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push vers GHCR
      security-events: write # upload SARIF Trivy (onglet Security)
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
      # Trivy via son image officielle (version fixe) : l'action composite
      # trivy-action@v0.28.0 référence setup-trivy@v0.2.1, retiré en amont.
      - name: Trivy scan (CRITICAL = échec)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             aquasec/trivy:0.76.2 image --scanners vuln --severity CRITICAL             --ignore-unfixed --exit-code 1 --no-progress "${IMAGE}:${{ steps.meta.outputs.tag }}"
      - name: Trivy rapport SARIF (onglet Security)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out"             aquasec/trivy:0.76.2 image --scanners vuln --severity CRITICAL,HIGH             --format sarif --output /out/trivy.sarif --no-progress "${IMAGE}:${{ steps.meta.outputs.tag }}"
      - uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        if: always()
        with:
          sarif_file: trivy.sarif
      - name: Login GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        run: docker push "${IMAGE}:${{ steps.meta.outputs.tag }}"

  gitops-update:
    name: GitOps - mise à jour du tag (ArgoCD synchronise)
    needs: build-scan-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit du nouveau tag d'image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bump image.tag dans le chart Helm
        env:
          TAG: ${{ needs.build-scan-push.outputs.tag }}
        run: |
          sed -i "s|^  repository: .*|  repository: ${IMAGE}|" helm/catalog-api/values.yaml
          sed -i "s|^  tag: .*|  tag: \"${TAG}\"|" helm/catalog-api/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: catalog-api ${TAG} [skip ci]" || echo "Rien à commiter"
          git push
