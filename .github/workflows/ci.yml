name: CI/CD catalog-api

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write        # commit du nouveau tag d'image (GitOps)
  packages: write        # push vers GHCR
  pull-requests: read
  security-events: write # upload SARIF Trivy

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/catalog-api

jobs:
  lint-test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests unitaires + couverture (Cobertura, seuil 85 %)
        run: pytest
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  sonar:
    name: SonarCloud Analysis & Quality Gate
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: Vérifier la configuration SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          ORG: ${{ vars.SONAR_ORGANIZATION }}
          KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          ok=true
          [ -n "$SONAR_TOKEN" ] || { echo "::error::Secret SONAR_TOKEN absent (Settings > Secrets > Actions)"; ok=false; }
          [ -n "$ORG" ] || { echo "::error::Variable SONAR_ORGANIZATION absente (onglet Variables)"; ok=false; }
          [ -n "$KEY" ] || { echo "::error::Variable SONAR_PROJECT_KEY absente (onglet Variables)"; ok=false; }
          echo "::notice::SonarCloud organization='$ORG' projectKey='$KEY' token=$([ -n "$SONAR_TOKEN" ] && echo present || echo absent)"
          $ok
      - name: SonarCloud scan
        id: scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
      - name: Diagnostic du scan
        if: failure() && steps.scan.outcome == 'failure'
        run: |
          for f in .scannerwork/report-task.txt; do [ -f "$f" ] && cat "$f"; done
          echo "::error::Le scanner SonarCloud a échoué : vérifier que l'organisation et la clé du projet existent, que le token est valide et que l'Automatic Analysis est désactivée."
      - name: Quality Gate (bloquant)
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  build-scan-push:
    name: Build, Trivy Scan & Push
    needs: sonar
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
      - name: Trivy scan (CRITICAL = échec)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy rapport SARIF (onglet Security)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
      - name: Login GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        run: docker push "${IMAGE}:${{ steps.meta.outputs.tag }}"

  gitops-update:
    name: GitOps - mise à jour du tag (ArgoCD synchronise)
    needs: build-scan-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump image.tag dans le chart Helm
        env:
          TAG: ${{ needs.build-scan-push.outputs.tag }}
        run: |
          sed -i "s|^  repository: .*|  repository: ${IMAGE}|" helm/catalog-api/values.yaml
          sed -i "s|^  tag: .*|  tag: \"${TAG}\"|" helm/catalog-api/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: catalog-api ${TAG} [skip ci]" || echo "Rien à commiter"
          git push
