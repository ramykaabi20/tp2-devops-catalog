sonar.projectName=catalog-api
# Code applicatif + infrastructure (Dockerfile, Helm, workflow CI, manifestes Kubernetes)
sonar.sources=app,Dockerfile,helm,k6,policies,observability,.github
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=**/*.yaml,**/*.yml,**/*.js,Dockerfile
sonar.sourceEncoding=UTF-8

# Exception documentée : HTTP en clair uniquement pour le trafic interne au cluster
# (OTLP vers le Collector, k6 vers le Service). En production, mTLS via service mesh.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=kubernetes:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.yaml
